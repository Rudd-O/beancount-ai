[tox]
envlist = basepython

[testenv]
setenv   =
    PYTHONPATH = {env:PYTHONPATH}{:}{toxinidir}
    MYPY_CACHE_DIR = {toxinidir}/.mypy_cache
deps =
    pytest
    mypy
    ruff
commands =
    python3 -m doctest beancount_ai/*py beancount_ai/*/*.py beancount_ai/*/*/*.py
    pytest -vv
    ruff check --select I --select C beancount_ai/
    mypy -p beancount_ai
