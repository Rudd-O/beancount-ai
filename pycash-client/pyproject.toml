
[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pycash-client"
version = "0.1.0"
description = "Help import cash receipts into Beancount via Open-WebUI LLM"
requires-python = ">=3.14"
dependencies = ["beancount", "colorama"]

[project.scripts]
pycash-client = "pycash_client.cli:main"

[tool.setuptools.packages.find]
include = ["pycash_client"]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
