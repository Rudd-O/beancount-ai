[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "beancount-ai"
version = "0.1.2"
description = "Help import cash receipts into Beancount via Open-WebUI LLM"
requires-python = ">=3.14"
dependencies = ["openwebui-client", "beancount", "colorama", "PyMuPDF", "webdav4", "httpx", "certifi"]

[project.scripts]
bean-ai-server = "beancount_ai.server.cli:main"
bean-ai = "beancount_ai.client.cli:main"

[tool.setuptools.package-data]
"beancount_ai" = ["*.md"]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true