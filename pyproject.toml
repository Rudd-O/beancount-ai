[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "beancount-ai"
version = "0.3.0"
license = "GPL-3.0"
description = "Help import cash receipts into Beancount using OpenAI-compatible LLM"
requires-python = ">=3.14"
dependencies = ["openwebui-client>=0.3", "beancount>=3.2", "colorama>=0.4", "PyMuPDF>=1.27", "webdav4>=0.11", "httpx>=0.28", "certifi>=2025"]
readme = "README.md"

[project.scripts]
bean-ai-server = "beancount_ai.server.cli:main"
bean-ai = "beancount_ai.client.cli:main"

[tool.setuptools.package-data]
"beancount_ai" = ["*.md"]
